<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Franco Galluzzo — Fraud prevention &amp; photography</title>
<meta name="description" content="Portfolio of Franco Galluzzo — fraud prevention analyst in Lisbon. Selected work, film photography, and about." />
<meta name="theme-color" content="#faf9f7" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&family=Hanken+Grotesk:wght@400;500;600&family=Inter+Tight:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Public+Sans:wght@400..900&family=Space+Grotesk:wght@300..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ============ TOKENS ============ */
  :root {
    /* gray tone: neutral by default. Hue/chroma overridden by the gray-tone tweak. */
    --tone-h: 0;
    --tone-c: 0;

    --bg:        oklch(0.992 var(--tone-c) var(--tone-h));
    --surface:   oklch(0.972 var(--tone-c) var(--tone-h));
    --line:      oklch(0.905 var(--tone-c) var(--tone-h));
    --line-soft: oklch(0.945 var(--tone-c) var(--tone-h));
    --ink:       #000000;
    --ink-2:     oklch(0.45 var(--tone-c) var(--tone-h));
    --ink-3:     oklch(0.62 var(--tone-c) var(--tone-h));

    /* accent — orange by default; overridden by the accent tweak */
    --accent:    #F59425;

    /* type */
    --font-display: "Schibsted Grotesk", system-ui, sans-serif;
    --font-body:    "Hanken Grotesk", system-ui, sans-serif;
    --font-meta:    "Hanken Grotesk", system-ui, sans-serif;
    --meta-tracking: 0.04em;
    --meta-transform: none;

    /* density */
    --pad-x: 7vw;
    --section-y: 120px;
    --header-body-gap: clamp(80px, 6vh, 72px);
    --landing-menu-text-gap: clamp(1px, 8vw, 100px);
    --landing-text-name-gap: clamp(110px, 12vh, 140px);
    --gap: 28px;
    --hero-size: clamp(2.6rem, 6.2vw, 5.6rem);

    --maxw: 1180px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: #000; color: #fff; }

  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="portfolio.jsx"></script>
</body>
</html>
